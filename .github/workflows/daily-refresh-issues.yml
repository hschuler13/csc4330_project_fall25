name: Daily Issue Refresh
on:
  schedule:
    # Runs at 2 AM UTC every day
    - cron: '0 2 * * *'

  # Allows you to manually trigger the workflow from GitHub UI
  workflow_dispatch:

jobs:
  refresh-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install requests  # For refresh_issues.py API calls

      - name: Check existing issues and remove closed ones
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd backend/python
          echo "🔍 Checking which issues are still open..."
          python refresh_issues.py

      - name: Run ML predictions on all scraped issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd backend/python
          echo "🤖 Running ML to pick top 100 issues from the pool..."
          python predict_issues.py

      - name: Commit updated database
        run: |
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add backend/src/database/userdb.sqlite
          git add backend/data/output/recommended_issues.csv
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Daily issue refresh: Removed closed issues and updated top 100 recommendations"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}